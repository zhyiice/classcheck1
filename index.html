<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4fa" id="metaTheme">
<title>晚自习查人工具</title>
<style>
/* ============ 主题变量：浅色 / 深色 ============ */
:root{
  --r-xl:28px; --r-lg:22px; --r-md:18px; --r-sm:14px; --r-xs:10px;
  --dur:.55s; --ease:cubic-bezier(.32,.72,.28,1);
  --spring:cubic-bezier(.34,1.45,.4,1);
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#e6eaf5;
  --panel:rgba(255,255,255,.62); --panel-solid:#ffffff; --card-bg:rgba(255,255,255,.88);
  --panel-border:rgba(255,255,255,.75); --panel-shadow:0 8px 32px rgba(60,70,110,.10);
  --ink:#1b2233; --sub:#5f6b82; --faint:#9aa4b8;
  --glass-hi:rgba(255,255,255,.85);
  --diff-bg:rgba(255,214,140,.28);  --diff-line:#f59e3d;  --diff-ink:#8a4d00;  --diff-chip:rgba(245,158,61,.16);
  --comm-bg:rgba(120,145,255,.20);  --comm-line:#6478e8;  --comm-ink:#31409a;  --comm-chip:rgba(100,120,232,.15);
  --free-bg:rgba(72,199,142,.16);   --free-line:#2fa96d;  --free-ink:#1c6b42;  --free-chip:rgba(47,169,109,.13);
  --brand:#3b4fd8;
  --accent1:#7a5cff; --accent2:#3ab0ff; --accent3:#ff6fa5; --accent4:#2fd4a7;
  --th-bg:rgba(59,79,216,.92); --th-bg2:#4a5fe0;
  --row-bg-solid:#f3f5fb; --hover-td:rgba(120,130,170,.10);
  --track:rgba(120,130,170,.28); --header-bg:rgba(238,241,248,.92);
}
html[data-theme="dark"]{
  --bg:#0c0e16; --bg2:#10131e;
  --panel:rgba(28,32,48,.62); --panel-solid:#1a1e2c; --card-bg:rgba(26,30,46,.92);
  --panel-border:rgba(255,255,255,.10); --panel-shadow:0 10px 40px rgba(0,0,0,.45);
  --ink:#e9ecf6; --sub:#9aa4bc; --faint:#6a7490;
  --glass-hi:rgba(255,255,255,.10);
  --diff-bg:rgba(245,158,61,.14);  --diff-line:#ffa04d;  --diff-ink:#ffc78a;  --diff-chip:rgba(245,158,61,.15);
  --comm-bg:rgba(100,120,232,.16); --comm-line:#8a9aff;  --comm-ink:#b3c0ff;  --comm-chip:rgba(100,120,232,.18);
  --free-bg:rgba(47,169,109,.14);  --free-line:#3ed694;  --free-ink:#8ae6b8;  --free-chip:rgba(47,169,109,.14);
  --brand:#8a9aff;
  --accent1:#8f6bff; --accent2:#2f9fff; --accent3:#ff6fa5; --accent4:#25d0a0;
  --th-bg:rgba(40,46,74,.96); --th-bg2:rgba(56,64,100,.96);
  --row-bg-solid:#20243a; --hover-td:rgba(255,255,255,.06);
  --track:rgba(255,255,255,.22); --header-bg:rgba(12,14,22,.90);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  padding-bottom:56px; min-height:100vh; position:relative; overflow-x:hidden;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
body.dev-desktop{font-size:14.5px}
body.dev-mobile .ctrls{display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); gap:7px 6px}
body.dev-mobile .ctrls label{font-size:11.5px}
body.dev-mobile .ctrls select{max-width:none; padding:6px 6px; font-size:12.5px}
body.dev-mobile .ctrls input[type=search]{grid-column:1 / -1; flex:none; min-width:0}

/* ============ 液态色散背景 ============ */
.liquid-bg{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; background:
  radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg) 70%);}
.orb{position:absolute; border-radius:50%; opacity:.42; contain:strict;
     will-change:transform; transition:background var(--dur) var(--ease);}
html[data-theme="dark"] .orb{opacity:.32}
.orb.o1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:radial-gradient(circle at 35% 35%, var(--accent1), transparent 70%);animation:drift1 40s ease-in-out infinite alternate}
.orb.o2{width:40vmax;height:40vmax;right:-12vmax;top:6vmax;background:radial-gradient(circle at 60% 40%, var(--accent2), transparent 70%);animation:drift2 46s ease-in-out infinite alternate}
.orb.o3{width:34vmax;height:34vmax;left:24vmax;bottom:-16vmax;background:radial-gradient(circle at 50% 50%, var(--accent3), transparent 70%);animation:drift3 42s ease-in-out infinite alternate}
.orb.o4{width:28vmax;height:28vmax;right:10vmax;bottom:-10vmax;background:radial-gradient(circle at 50% 50%, var(--accent4), transparent 70%);animation:drift1 52s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,7vmax) scale(1.18)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8vmax,9vmax) scale(.94)}}
@keyframes drift3{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(-7vmax,-8vmax) rotate(30deg)}}
/* 色散网格微光 */
.disperse-grid{position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background:
   linear-gradient(115deg, transparent 30%, rgba(255,255,255,.05) 45%, transparent 60%),
   repeating-linear-gradient(90deg, rgba(120,120,180,.035) 0 1px, transparent 1px 90px);
}
html[data-theme="dark"] .disperse-grid{opacity:.35}

/* ============ 通用玻璃面板 ============ */
.glass{
  background:var(--card-bg);
  border:1px solid var(--panel-border);
  box-shadow:0 3px 16px rgba(50,60,110,.08), inset 0 1px 0 var(--glass-hi);
  transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}

/* ============ 顶栏 ============ */
header{
  position:sticky; top:0; z-index:40; padding:10px 14px 12px;
  background:linear-gradient(150deg, rgba(123,92,255,.14), rgba(58,176,255,.09) 45%, rgba(255,111,165,.09)), var(--header-bg);
  border-bottom:1px solid var(--panel-border);
  box-shadow:0 6px 28px rgba(50,60,110,.10);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.hrow{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.hrow h1{margin:0; font-size:16px; font-weight:800; letter-spacing:.2px; flex:1;
         display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; min-width:0;
         background:linear-gradient(100deg, var(--ink), var(--sub));
         -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.hrow h1 .ttl{white-space:nowrap; flex:0 0 auto}
.hrow h1 .tag{font-size:11px; font-weight:600; flex:0 0 auto; -webkit-text-fill-color:var(--comm-ink);
  background:var(--comm-chip); border:1px solid var(--comm-line);
  padding:2px 9px; border-radius:999px; vertical-align:2px}
.hbtns{display:flex; gap:7px; flex:0 0 auto}
body.dev-mobile .hbtns button{padding:6px 10px; font-size:12px}
body.dev-mobile #themebtn{width:34px; height:34px; font-size:15px}
.ctrls{display:flex; flex-wrap:nowrap; gap:7px 8px; align-items:center; min-width:0}
.ctrls label{font-size:12px; color:var(--sub); font-weight:600; flex:0 0 auto; white-space:nowrap}
.ctrls select{flex:0 1 auto; min-width:0; max-width:32%; white-space:nowrap; text-overflow:ellipsis}
select,input[type=search],button{
  font:inherit; font-size:13px; border-radius:var(--r-sm);
  background:var(--card-bg); color:var(--ink); padding:7px 11px; outline:none;
  border:1px solid var(--panel-border);
  box-shadow:inset 0 1px 0 var(--glass-hi), 0 2px 10px rgba(50,60,110,.08);
  transition:transform .18s var(--spring), box-shadow .3s var(--ease), background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
select{cursor:pointer; font-weight:600}
select option{color:#1b2233; background:#fff}
html[data-theme="dark"] select option{color:#e9ecf6; background:#1a1e2c}
input[type=search]{min-width:110px; flex:1 1 120px; border-radius:999px; padding-left:15px}
input[type=search]::placeholder{color:var(--faint)}
input[type=search]:focus,select:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px rgba(58,140,255,.25), inset 0 1px 0 var(--glass-hi);
  transform:translateY(-1px);
}
button{
  cursor:pointer; font-weight:700; border:1px solid var(--panel-border);
  color:var(--ink); position:relative; overflow:hidden; user-select:none;
}
button{transition:transform .32s cubic-bezier(.34,1.6,.5,1), box-shadow .3s var(--ease), background-color .4s var(--ease), color .4s var(--ease), border-color .4s var(--ease)}
button:active{transform:scale(.96)}
button.ghost{background:var(--panel)}
button.primary{
  background:linear-gradient(135deg, var(--accent1), var(--brand));
  color:#fff; border-color:transparent;
  box-shadow:0 4px 14px rgba(122,92,255,.35);
}
/* 主题切换按钮：圆形图标按钮 */
#themebtn{
  width:38px; height:38px; padding:0; border-radius:50%; font-size:17px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--panel);
}
#themebtn .ico{display:inline-block; transition:transform .6s var(--spring)}
html[data-theme="dark"] #themebtn .ico{transform:rotate(180deg) scale(.9)}
/* 拟真震动反馈动画（视觉“哒哒”触感） */
.haptic{animation:haptic .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes haptic{
  0%{transform:translate(0,0) rotate(0)}
  18%{transform:translate(-1.6px,.8px) rotate(-1.4deg)}
  42%{transform:translate(1.6px,-.6px) rotate(1.4deg)}
  68%{transform:translate(-.8px,.3px) rotate(-.6deg)}
  100%{transform:translate(0,0) rotate(0)}
}
.haptic-scope{animation:scopeShake .32s ease-out}
@keyframes scopeShake{
  0%{transform:translate(0,0)}
  25%{transform:translate(1px,-.5px)}
  55%{transform:translate(-.8px,.4px)}
  100%{transform:translate(0,0)}
}

/* ============ 可折叠提示块 ============ */
.loose{margin:14px 14px 0; border-radius:var(--r-lg); overflow:hidden;
  color:var(--diff-ink); font-size:12.5px; position:relative}
.loose::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(120deg, rgba(245,158,61,.16), transparent 55%)}
.loose.hide{display:none}
.lhead{display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:0;
  color:var(--diff-ink); font-weight:700; font-size:12.5px; padding:11px 14px; cursor:pointer; text-align:left;
  box-shadow:none; border-radius:0}
.lhead:active{transform:none}
.lhead .cnt{margin-left:auto; font-weight:500; color:var(--diff-ink); opacity:.75; font-size:11.5px}
.lhead .arrow{transition:transform .45s var(--spring); display:inline-block; opacity:.7}
.loose.open .lhead .arrow{transform:rotate(180deg)}
.lbody{height:0; opacity:0; overflow:hidden; padding:0 14px;
  transition:height .5s cubic-bezier(.3,.75,.3,1), opacity .38s ease}
.loose.open .lbody{opacity:1; padding:0 14px 12px}
.linner{line-height:1.8; transform:translateY(-6px); transition:transform .5s cubic-bezier(.3,.75,.3,1)}
.loose.open .linner{transform:none}
.linner .k{display:inline-block; min-width:56px; font-weight:800}
body.dev-mobile .loose{margin-left:10px; margin-right:10px}

/* ============ 上课人员筛选 ============ */
.pf{display:flex; align-items:center; gap:9px; margin:12px 14px 0; padding:10px 14px;
  border-radius:var(--r-lg); font-size:12.5px; color:var(--sub); flex-wrap:nowrap}
.pf label{white-space:nowrap; flex:0 0 auto; font-weight:600}
.pf select{flex:1 1 auto; min-width:0; max-width:100%}
body.dev-mobile .pf{margin-left:10px; margin-right:10px; padding:8px 11px}

/* ============ 统计 ============ */
.stats{padding:14px 16px 0; font-size:12.5px; color:var(--sub); display:flex; flex-wrap:wrap; gap:6px 10px}
.stats b{color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums}
.stats span{padding:4px 12px; border-radius:999px; background:var(--card-bg);
  border:1px solid var(--panel-border);
  transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease)}
.stats .cat{color:var(--diff-ink); border-color:var(--diff-line); background:var(--diff-chip)}
.stats .cat b{color:var(--diff-ink)}
main{padding:0 14px}
body.dev-mobile main, body.dev-mobile .stats{padding-left:10px; padding-right:10px}
.sectitle{font-size:12.5px; color:var(--sub); margin:18px 4px 10px; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.5px}
.sectitle::after{content:""; flex:1; height:1px;
  background:linear-gradient(90deg, var(--track), transparent)}

/* ============ 卡片 ============ */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:11px}
.card{
  border-radius:var(--r-lg); padding:11px 14px; min-width:0; position:relative;
  background:var(--card-bg);
  border:1px solid var(--panel-border);
  box-shadow:0 2px 10px rgba(50,60,110,.07);
  overflow:hidden;
  animation:cardIn .6s var(--spring) backwards;
  animation-delay:calc(var(--i,0) * 22ms);
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(18px) scale(.94)}
  to{opacity:1; transform:none}
}
.card:active{transform:scale(.975); transition:transform .3s cubic-bezier(.34,1.6,.5,1)}
/* 左侧彩色能量条（液态发光） */
.card::before{content:""; position:absolute; left:0; top:10%; bottom:10%; width:4.5px; border-radius:99px;
  transition:background var(--dur) var(--ease), box-shadow var(--dur) var(--ease)}
.card.diff::before{background:linear-gradient(180deg,var(--diff-line),transparent); box-shadow:0 0 14px var(--diff-line)}
.card.comm::before{background:linear-gradient(180deg,var(--comm-line),transparent); box-shadow:0 0 14px var(--comm-line)}
.card.free::before{background:linear-gradient(180deg,var(--free-line),transparent); box-shadow:0 0 12px var(--free-line)}
.card.diff{background:linear-gradient(160deg, var(--diff-bg), var(--card-bg) 55%)}
.card.comm{background:linear-gradient(160deg, var(--comm-bg), var(--card-bg) 55%)}
.card.free{background:linear-gradient(160deg, var(--free-bg), var(--card-bg) 55%)}
.card .hd{display:flex; align-items:baseline; gap:7px; min-width:0}
.card .no{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:18px}
.card .nm{font-weight:800; font-size:15.5px; letter-spacing:.5px; flex:0 0 auto}
.card .st{font-size:11.5px; padding:2.5px 10px; border-radius:999px; flex:0 0 auto; font-weight:700;
  border:1px solid transparent; transition:all var(--dur) var(--ease)}
.card .sid{margin-left:auto; font-size:10.5px; color:var(--faint); flex:0 0 auto; font-variant-numeric:tabular-nums}
.card.diff .st{background:var(--diff-chip); color:var(--diff-ink); border-color:var(--diff-line)}
.card.comm .st{background:var(--comm-chip); color:var(--comm-ink); border-color:var(--comm-line)}
.card.free .st{background:var(--free-chip); color:var(--free-ink); border-color:var(--free-line)}
.card .de{margin-top:5px; font-size:12.5px; color:var(--sub); min-width:0}
.card .c{padding:2.5px 0; word-break:break-word}
.card .cn{color:var(--ink); font-weight:700}
.card .wk{color:var(--diff-ink); font-size:11.5px; margin-left:3px; opacity:.85}
.card .loc{color:var(--sub); font-size:11.5px; margin-left:4px}
.card .when{color:var(--faint); font-size:11px; margin-left:6px; white-space:nowrap}
.card .looseNote{margin-top:5px; font-size:11.5px; color:var(--diff-ink);
  background:var(--diff-chip); border-radius:var(--r-xs); padding:3px 9px; display:inline-block}

/* 手机卡片 */
body.dev-mobile .cards{display:block}
body.dev-mobile .card{
  display:flex; align-items:center; gap:9px; padding:8px 12px; margin-bottom:7px;
}
body.dev-mobile .card::before{top:18%; bottom:18%}
body.dev-mobile .card .hd{flex:0 0 auto; gap:6px}
body.dev-mobile .card .nm{font-size:14.5px}
body.dev-mobile .card .st{font-size:10.5px; padding:1.5px 8px}
body.dev-mobile .card .no{min-width:15px; font-size:10.5px}
body.dev-mobile .card .sid{display:none}
body.dev-mobile .card .de{
  margin:0; flex:1 1 auto; min-width:0; font-size:12px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
body.dev-mobile .card .c{display:inline; padding:0}
body.dev-mobile .card .c + .c::before{content:"；"; color:var(--faint)}
body.dev-mobile .card .when{display:none}
body.dev-mobile .card .looseNote{display:none}

/* ============ 网格表 ============ */
.tablewrap{overflow:auto; border-radius:var(--r-lg); -webkit-overflow-scrolling:touch; position:relative}
table{border-collapse:separate; border-spacing:0; font-size:12px; white-space:nowrap}
th,td{padding:6px 9px; text-align:center}
td{border-right:1px solid var(--track); border-bottom:1px solid var(--track)}
thead th{position:sticky; top:0; z-index:2; font-weight:700; color:#fff;
  background:linear-gradient(160deg, var(--th-bg2), var(--th-bg))}
thead th:first-child{border-top-left-radius:var(--r-sm)}
thead th:last-child{border-top-right-radius:var(--r-sm)}
thead th.gno{font-size:10.5px; color:rgba(255,255,255,.75)}
tbody th{position:sticky; left:0; z-index:1; text-align:left; font-weight:800;
  background:var(--row-bg-solid); border-right:1px solid var(--track)}
tbody tr:hover td{background-color:var(--hover-td)}
td.diff{background:var(--diff-bg); color:var(--diff-ink); text-align:left; vertical-align:top}
td.diff .c{display:block; line-height:1.5}
td.comm{background:var(--comm-bg); color:var(--comm-ink)}
td.free{background:var(--free-bg); color:var(--faint)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:10px 4px 0}
.legend i{display:inline-block; width:12px; height:12px; border-radius:4.5px; margin-right:5px; vertical-align:-1.5px;
  border:1px solid var(--track)}
.empty{padding:30px; text-align:center; color:var(--sub); border-radius:var(--r-lg);
  animation:cardIn .5s var(--spring)}
footer{padding:20px 16px 8px; font-size:11.5px; color:var(--faint); text-align:center}

::view-transition-old(root), ::view-transition-new(root){animation:none; mix-blend-mode:normal}
/* 切换时整页丝滑过渡 */

/* ===== 窄视口统一紧凑布局（含：手机上模拟电脑版的情况） ===== */
@media (max-width:680px){
  .ctrls{display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); gap:7px 6px}
  .ctrls label{font-size:11.5px}
  .ctrls select{max-width:none; padding:6px 6px; font-size:12.5px; flex:none; width:100%}
  .ctrls input[type=search]{grid-column:1 / -1; flex:none; min-width:0}
  .pf{padding:8px 11px; gap:7px}
  .pf select{font-size:12.5px}
  .stats{gap:5px 8px}
  .stats span{padding:3px 10px; font-size:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
@media print{
  header,.pf,.lhead,.hbtns,.liquid-bg,.disperse-grid,.orb{display:none !important}
  body{background:#fff; font-size:12px; padding-bottom:0; color:#000}
  .card,.loose,.tablewrap{background:#fff !important; box-shadow:none; border:1px solid #ccc; backdrop-filter:none}
  .loose.open .lbody{grid-template-rows:1fr; opacity:1}
  .loose{break-inside:avoid}
  .card{break-inside:avoid}
  .tablewrap{overflow:visible}
  thead th{background:#1f3864 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  td.diff,td.comm,td.free,.card,.stats .cat,.stats span{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
</head>
<body>
<script>
/* 首屏：设备 + 主题，避免闪烁 */
(function () {
  try {
    var s = localStorage.getItem("wl_checker_ver");
    if (s !== "mobile" && s !== "desktop") {
      var ua = navigator.userAgent || "";
      var w = Math.min(window.innerWidth || 9999, (window.screen && window.screen.width) || 9999);
      s = (/Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile|MicroMessenger|MiuiBrowser|HeyTapBrowser|Quark/i.test(ua) || w < 700) ? "mobile" : "desktop";
    }
    document.body.className = "dev-" + s;
  } catch (e) {}
  var t = null;
  try { t = localStorage.getItem("wl_theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {

/* ==================== 主题管理 ==================== */
let theme = document.documentElement.getAttribute("data-theme") || "light";
function updateThemeUI() {
  $("themeIco").textContent = theme === "dark" ? "☀️" : "🌙";
  $("metaTheme").setAttribute("content", theme === "dark" ? "#0c0e16" : "#eef1f8");
}
function setTheme(t, animate) {
  if (t === theme) { updateThemeUI(); return; }
  theme = t;
  try { localStorage.setItem("wl_theme", t); } catch (e) {}
  updateThemeUI();
  const doIt = () => document.documentElement.setAttribute("data-theme", t);
  if (!animate || !document.startViewTransition) { doIt(); return; }
  const vt = document.startViewTransition(doIt);
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: ["circle(0% at 92% 4%)", "circle(150% at 92% 4%)"] },
      { duration: 400, easing: "cubic-bezier(.3,.7,.3,1)", pseudoElement: "::view-transition-new(root)" }
    );
  }).catch(() => {});
}
/* 视觉拟真震动（哒哒触感） */
function hapticFeedback(el, scope) {
  el.classList.remove("haptic");
  void el.offsetWidth;
  el.classList.add("haptic");
  if (scope) {
    const s = $(scope);
    s.classList.remove("haptic-scope");
    void s.offsetWidth;
    s.classList.add("haptic-scope");
  }
  // 若设备支持，叠加真实短脉冲（不影响无支持设备）
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
}

const LOOSE = new Map(), LOOSE_CLASS = [];

  if (who === "全班") { LOOSE_CLASS.push({ course, weeks, teacher, note }); continue; }
  for (const w of weeks) {

    LOOSE.get(k).push({ course, teacher, note });
  }
}

/* ==================== 设备检测 ==================== */
const LSKEY = "wl_checker_ver";
function detectDevice() {
  let saved = null;
  try { saved = localStorage.getItem(LSKEY); } catch (e) {}
  const ua = navigator.userAgent || "";
  const uaMobile = /Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile|MicroMessenger|MiuiBrowser|HeyTapBrowser|Quark/i.test(ua);
  const coarse = window.matchMedia ? window.matchMedia("(pointer:coarse)").matches : false;
  const screenW = (window.screen && window.screen.width) || 9999;
  const vw = window.innerWidth || 9999;
  const narrow = Math.min(vw, screenW) < 700 || (coarse && Math.min(vw, screenW) < 1100);
  // UA 与记住的版本矛盾（如 Edge/Chrome 手机开了“桌面模式”后 UA 变了）→ 放弃记忆重新判定
  const savedConsistent = (saved === "mobile" && uaMobile) || (saved === "desktop" && !uaMobile);
  if (saved && savedConsistent) return saved;
  if (uaMobile && narrow) return "mobile";
  if (uaMobile) return "mobile";
  return narrow ? "mobile" : "desktop";
}
let device = detectDevice(), manual = false;
try { manual = !!localStorage.getItem(LSKEY); } catch (e) {}

function applyDevice() {
  document.body.classList.toggle("dev-mobile", device === "mobile");
  document.body.classList.toggle("dev-desktop", device === "desktop");
  $("devtag").textContent = device === "mobile" ? "手机版" : "电脑版";
  $("devbtn").textContent = device === "mobile" ? "切电脑版" : "切手机版";
}

/* ==================== 当前时间 → 默认周次/星期 ==================== */
function currentWeekNo() {
  const s = CFG.学期开始日期;
  if (!s) return CFG.当前周次;
  const start = new Date(s + "T00:00:00");
  if (isNaN(start.getTime())) return CFG.当前周次;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.floor((today - start) / 86400000);
  if (days < 0) return 1;
  return Math.min(Math.max(Math.floor(days / 7) + 1, 1), CFG.总周数);
}
function currentDay() {
  const i = new Date().getDay();
  return DAYS[(i + 6) % 7];
}

/* ==================== 初始化下拉 ==================== */
let onlyClass = false, whoFilter = "all";

function fillSelects() {
  const wk = $("wk");
  for (let w = 1; w <= CFG.总周数; w++) wk.appendChild(new Option("第 " + w + " 周", w));
  wk.value = String(currentWeekNo());

  const day = $("day");
  DAYS.forEach(d => day.appendChild(new Option(d, d)));
  day.appendChild(new Option("整周", "*"));          // “整周”放最后
  day.value = currentDay();

  const per = $("per");
  per.appendChild(new Option(BLOCK + " 节", BLOCK));
  per.appendChild(new Option("全部节次", "*"));       // “全部节次”放最后
  per.value = BLOCK;
}

/* ==================== 渲染 ==================== */
function activeSlots() {
  const daySel = $("day").value, perSel = $("per").value;
  if (perSel === "*") return [];
  const days = daySel === "*" ? DAYS : [daySel];
  return days.map(d => [d, BLOCK]);
}

function courseListFor(w, days) {
  const set = new Set();
  for (const d of days) for (const n of NAMES) {
    const hit = IDX.get(w + "|" + d + "|" + n);
    if (hit && hit.status !== "共同课") hit.courses.forEach(c => set.add(c[0]));
    else if (hit) hit.courses.forEach(c => set.add(c[0]));
  }
  return [...set].sort((a, b) => a.localeCompare(b, "zh"));
}

function renderWhoOptions(w, slots) {
  const sel = $("who");
  const daySel = $("day").value;
  const days = daySel === "*" ? DAYS : [daySel];
  const courses = courseListFor(w, days);
  const prev = sel.value;
  sel.innerHTML = "";
  sel.appendChild(new Option(daySel === "*" ? "查看全部人员（整周）" : "查看全部人员（" + daySel + "）", "all"));
  sel.appendChild(new Option("只看应到人员（无课）", "free"));
  if (!courses.length) {
    const o = new Option("（这天的晚自习没有课）", "none");
    o.disabled = true;
    sel.appendChild(o);
  }
  courses.forEach(c => sel.appendChild(new Option(c + "上课人员", "c:" + c)));
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : "all";
  whoFilter = sel.value;
}

function render(animate) {
  const w = Number($("wk").value);
  const slots = activeSlots();
  const daySel = $("day").value;
  const q = $("q").value.trim();

  const days = daySel === "*" ? DAYS : [daySel];
  const multiDay = days.length > 1;
  const perSlot = [];
  for (const n of NAMES) {
    const items = [];
    for (const d of days) {
      const hit = IDX.get(w + "|" + d + "|" + n);
      if (hit) items.push({ day: d, hit });
    }
    perSlot.push({ name: n, items });
  }

  const isFree = it => it.items.length === 0;
  const hasCourse = (it, c) => it.items.some(x => x.hit.status !== "共同课" && x.hit.courses.some(cc => cc[0] === c));

  let nDiff = 0, nComm = 0, nFree = 0;
  for (const it of perSlot) {
    const hasDiff = it.items.some(x => x.hit.status !== "共同课");
    if (hasDiff) nDiff++; else if (it.items.length) nComm++; else nFree++;
  }

  // ---- 统计小字 ----
  let statHtml =
    '<span>有课：<b>' + nDiff + '</b> 人</span>' +
    '<span>应到自习：<b>' + nFree + '</b> 人</span>' +
    '<span>共 <b>' + NAMES.length + '</b> 人</span>';
  if (nComm) statHtml += '<span>共同课：<b>' + nComm + '</b> 人</span>';
  if (whoFilter.startsWith("c:")) {
    const c = whoFilter.slice(2);
    statHtml += '<span class="cat">' + esc(c) + '上课人员 <b>' + perSlot.filter(it => hasCourse(it, c)).length + '</b> 人</span>';
  } else if (whoFilter === "free") {
    statHtml += '<span class="cat">应到人员 <b>' + nFree + '</b> 人</span>';
  }
  $("stats").innerHTML = statHtml;

  // ---- 黄色提示块 ----
  const cls = LOOSE_CLASS.filter(x => x.weeks.includes(w));
  const ppl = [];
  for (const n of NAMES) { const l = LOOSE.get(w + "|" + n); if (l) ppl.push([n, l]); }
  const lbox = $("loose");
  if (cls.length || ppl.length) {
    let h = "";
    if (cls.length) h += '<div><span class="k">全班</span>' + cls.map(c => esc(c.course) + "（" + esc(c.note) + "）").join("、") + '</div>';
    if (ppl.length) h += '<div><span class="k">个人</span>' +
      ppl.map(([n, l]) => esc(n) + "：" + l.map(c => esc(c.course)).join("、")).join("；") + '</div>';
    $("looseInner").innerHTML = h;
    $("looseTitle").textContent = "第 " + w + " 周 · 无固定节次的课（" + (cls.length + ppl.length) + " 项）";
    $("looseCnt").textContent = "不占晚自习格子";
    lbox.classList.remove("hide");
    const lb = lbox.querySelector(".lbody");
    if (lbox.classList.contains("open")) lb.style.height = "auto";
  } else {
    lbox.classList.add("hide");
    lbox.classList.remove("open");
  }

  // ---- 逐人卡片 ----
  const box = $("cards");
  box.innerHTML = "";
  const shown = perSlot.filter(it => !q || it.name.includes(q));
  let rendered = 0;
  for (const it of shown) {
    if (whoFilter === "free" && !isFree(it)) continue;
    if (whoFilter.startsWith("c:") && !hasCourse(it, whoFilter.slice(2))) continue;
    if (onlyClass && isFree(it)) continue;
    rendered++;

    const hasDiff = it.items.some(x => x.hit.status !== "共同课");
    const key = hasDiff ? "diff" : (it.items.length ? "comm" : "free");
    const st = key === "diff" ? "有课" : (key === "comm" ? "共同课" : "应到自习");
    const no = (ROSTER[it.name] && ROSTER[it.name].序号) || "";
    const sid = (ROSTER[it.name] && ROSTER[it.name].学号) || "";

    let de = "";
    if (key === "free") {
      de = '<div class="c">该时段无课</div>';
    } else if (key === "comm") {
      de = it.items.map(x => '<div class="c"><span class="cn">' +
        esc(x.hit.courses.map(c => c[0]).join(" / ")) + '</span>' +
        (multiDay ? '<span class="when">' + x.day + '</span>' : '') + '</div>').join("");
    } else {
      for (const x of it.items) {
        if (x.hit.status === "共同课") continue;
        for (const c of x.hit.courses) {
          de += '<div class="c"><span class="cn">' + esc(c[0]) + '</span>' +
                '<span class="wk">(' + esc(c[1]) + '周)</span>' +
                (c[2] ? '<span class="loc">@' + esc(c[2]) + '</span>' : '') +
                (multiDay ? '<span class="when">' + x.day + ' ' + BLOCK + '节</span>' : '') +
                '</div>';
        }
      }
    }
    const mine = LOOSE.get(w + "|" + it.name);
    if (mine) de += '<div class="looseNote">本周另有：' + esc(mine.map(c => c.course).join("、")) + '</div>';

    let deMobile = de;
    if (device === "mobile") {
      if (key === "free") deMobile = "该时段无课";
      else {
        const arr = [];
        for (const x of it.items) for (const c of x.hit.courses) arr.push(c[0] + "(" + c[1] + "周)" + (c[2] ? "@" + c[2] : ""));
        deMobile = esc(arr.join("；"));
      }
    }
    const el = document.createElement("div");
    el.className = "card " + key;
    el.style.setProperty("--i", Math.min(rendered - 1, 24));
    el.innerHTML = '<div class="hd"><span class="no">' + no + '</span>' +
      '<span class="nm">' + esc(it.name) + '</span>' +
      '<span class="st">' + st + '</span>' +
      (sid ? '<span class="sid">' + esc(sid) + '</span>' : '') + '</div>' +
      '<div class="de">' + deMobile + '</div>';
    box.appendChild(el);
  }
  $("cardsEmpty").style.display = rendered ? "none" : "block";

  // ---- 网格 ----
  const g = $("grid");
  let html = "<thead><tr><th class='gno' style='position:sticky;left:0;z-index:4'>序号</th>" +
             "<th style='position:sticky;left:56px;z-index:4'>姓名</th>";
  for (const d of DAYS) html += "<th>" + d + " " + BLOCK + "节</th>";
  html += "</tr></thead><tbody>";
  for (let i = 0; i < NAMES.length; i++) {
    const n = NAMES[i];
    const no = (ROSTER[n] && ROSTER[n].序号) || (i + 1);
    let good = false;
    for (const d of DAYS) {
      const hit = IDX.get(w + "|" + d + "|" + n);
      if (hit && hit.status !== "共同课") { good = true; break; }
    }
    if (whoFilter === "free" && good) continue;
    if (whoFilter.startsWith("c:")) {
      const c = whoFilter.slice(2);
      let has = false;
      for (const d of DAYS) {
        const hit = IDX.get(w + "|" + d + "|" + n);
        if (hit && hit.status !== "共同课" && hit.courses.some(cc => cc[0] === c)) { has = true; break; }
      }
      if (!has) continue;
    }
    if (q && !n.includes(q)) continue;
    html += "<tr><th>" + no + "</th><th>" + esc(n) + "</th>";
    for (const d of DAYS) {
      const hit = IDX.get(w + "|" + d + "|" + n);
      if (!hit) html += "<td class='free'>·</td>";
      else if (hit.status === "共同课") html += "<td class='comm'>共同课</td>";
      else {
        const inner = hit.courses.map(c => '<span class="c">' + esc(c[0]) +
          '<span class="wk">(' + esc(c[1]) + '周)</span>' +
          (c[2] ? '<span class="loc">@' + esc(c[2]) + '</span>' : '') + '</span>').join("");
        html += "<td class='diff'>" + inner + "</td>";
      }
    }
    html += "</tr>";
  }
  html += "</tbody>";
  g.innerHTML = html;
}

/* ==================== 事件 ==================== */
function init() {
  fillSelects();
  applyDevice();
  updateThemeUI();

  $("themebtn").addEventListener("click", function () {
    hapticFeedback(this, "stats");
    setTheme(theme === "dark" ? "light" : "dark", true);
  });
  // 跟随系统（未手动设置时）
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    let follow = true;
    try { follow = !localStorage.getItem("wl_theme"); } catch (e) {}
    const onChange = e => { if (follow) setTheme(e.matches ? "dark" : "light", true); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  ["wk", "day", "per"].forEach(id => $(id).addEventListener("change", function () {
    this.animate([{ transform: "scale(1)" }, { transform: "scale(1.025)", offset: .4 }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(.34,1.4,.5,1)" });
    render(); renderWhoOptions(Number($("wk").value), activeSlots()); render(true);
  }));
  let qT = null;
  $("q").addEventListener("input", () => {
    clearTimeout(qT);
    qT = setTimeout(() => render(), 120);   // 搜索防抖，动画更顺滑
  });
  $("who").addEventListener("change", function () {
    this.animate([{ transform: "scale(1)" }, { transform: "scale(1.025)", offset: .4 }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(.34,1.4,.5,1)" });
    whoFilter = $("who").value; render(true);
  });
  $("looseHead").addEventListener("click", function () {
    this.animate([{ transform: "scale(1)" }, { transform: "scale(.985)", offset: .4 }, { transform: "scale(1)" }], { duration: 320, easing: "cubic-bezier(.34,1.4,.5,1)" });
    const box = $("loose"), body = box.querySelector(".lbody");
    if (box.classList.contains("open")) {
      // 折叠：先固定当前高度，再收到 0
      body.style.height = body.scrollHeight + "px";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        body.style.height = "0px"; body.style.opacity = "0";
        box.classList.remove("open");
      }));
    } else {
      // 展开：从 0 撑到内容真实高度，结束后交还自动高度
      box.classList.add("open");
      body.style.height = "0px"; body.style.opacity = "0";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        body.style.height = body.scrollHeight + "px"; body.style.opacity = "1";
      }));
      body.addEventListener("transitionend", function te(e) {
        if (e.propertyName !== "height") return;
        body.removeEventListener("transitionend", te);
        if (box.classList.contains("open")) body.style.height = "auto";
      });
    }
  });
  $("printbtn").addEventListener("click", function () {
    this.animate([{ transform: "scale(1)" }, { transform: "scale(.965)", offset: .4 }, { transform: "scale(1)" }], { duration: 340, easing: "cubic-bezier(.34,1.4,.5,1)" });
    setTimeout(() => window.print(), 120);
  });
  $("devbtn").addEventListener("click", function () {
    device = device === "mobile" ? "desktop" : "mobile";
    manual = true;
    try { localStorage.setItem(LSKEY, device); } catch (e) {}
    applyDevice();
    render();
  });

  let t = null;
  window.addEventListener("resize", () => {
    if (manual) return;
    clearTimeout(t);
    t = setTimeout(() => {
      const d = detectDevice();
      if (d !== device) { device = d; applyDevice(); render(); }
    }, 250);
  });

  const w = Number($("wk").value);
  renderWhoOptions(w, activeSlots());
  render();
}
init();
</script>
</body>
</html>
